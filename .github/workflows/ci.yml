name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every build and test job stays CGO_ENABLED=0 (D-09, D-61). The race job
  # below is the only cgo use.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Module boundaries (D-21, D-31)
        run: go run ./tools/archcheck
      - name: Known vulnerabilities (D-62)
        run: go tool govulncheck ./...

  # The OpenAPI contract (D-57). Linux only, to avoid line-ending noise.
  api-contract:
    name: api-contract
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: OpenAPI lint (D-57)
        run: go tool vacuum lint --fail-severity error api/openapi.yaml
      - name: Generated API code matches the spec (D-57)
        run: |
          go generate ./internal/api/...
          if [ -n "$(git status --porcelain -- internal/api)" ]; then
            git status --porcelain -- internal/api
            git diff --stat -- internal/api
            exit 1
          fi

  # The race detector needs cgo (D-61).
  race:
    name: race (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  # The web UIs (D-152): the unit checks of the admin UI and the consumer web page, then the
  # browser end-to-end tests of the admin UI and the consumer web page against the Go harness with
  # the fake engine. Linux only; the report and traces are kept only when it fails.
  web-admin:
    name: web-admin
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Unit and component tests, type check, build
        run: make web-admin-test
      - name: Consumer web page tests, type check, build (PLT-F-036)
        run: make web-consumer-test
      - name: Chromium and its system libraries
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests, admin UI and consumer page (D-152)
        run: make web-e2e
      - name: Keep the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report/
            web/e2e/test-results/
          if-no-files-found: ignore

  # The macOS and Linux install script (PLT-F-043): shellcheck, then its bats tests. The tests use a
  # fake release folder and stubs, so they need no network and touch no real system. Linux only:
  # the no-terminal tests need setsid, which macOS lacks.
  install-scripts-sh:
    name: install-scripts-sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: shellcheck (installed on the runner image)
        run: shellcheck scripts/install.sh
      - name: bats tests of install.sh
        run: npx --yes bats@1.13.0 scripts/test/install.bats

  # The Windows install script (PLT-F-043). The script has to run in Windows PowerShell 5.1 and in
  # PowerShell 7, so it is parsed and tested in both. Pester is pinned to an exact version.
  install-scripts-ps:
    name: install-scripts-ps (${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Parse install.ps1
        run: |
          $errors = $null
          $path = (Resolve-Path scripts/install.ps1).Path
          $null = [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_.ToString() }
            exit 1
          }
          Write-Host "install.ps1 parses in PowerShell $($PSVersionTable.PSVersion)"
      - name: Install Pester 5.9.1
        run: |
          Install-Module -Name Pester -RequiredVersion 5.9.1 -Force -SkipPublisherCheck -Scope CurrentUser
      - name: Pester tests of install.ps1
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          Import-Module Pester -RequiredVersion 5.9.1
          Invoke-Pester -Path scripts/test -CI
