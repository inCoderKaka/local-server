name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every build and test job stays CGO_ENABLED=0 (D-09, D-61). The race job
  # below is the only cgo use.
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: Module boundaries (D-21, D-31)
        run: go run ./tools/archcheck
      - name: Known vulnerabilities (D-62)
        run: go tool govulncheck ./...

  # The OpenAPI contract (D-57). Linux only, to avoid line-ending noise.
  api-contract:
    name: api-contract
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: OpenAPI lint (D-57)
        run: go tool vacuum lint --fail-severity error api/openapi.yaml
      - name: Generated API code matches the spec (D-57)
        run: |
          go generate ./internal/api/...
          if [ -n "$(git status --porcelain -- internal/api)" ]; then
            git status --porcelain -- internal/api
            git diff --stat -- internal/api
            exit 1
          fi

  # The race detector needs cgo (D-61).
  race:
    name: race (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  # The web UIs (D-152): the unit checks of the admin UI and the consumer web page, then the
  # browser end-to-end tests of the admin UI and the consumer web page against the Go harness with
  # the fake engine. Linux only; the report and traces are kept only when it fails.
  web-admin:
    name: web-admin
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Unit and component tests, type check, build
        run: make web-admin-test
      - name: Consumer web page tests, type check, build (PLT-F-036)
        run: make web-consumer-test
      - name: Chromium and its system libraries
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Browser end-to-end tests, admin UI and consumer page (D-152)
        run: make web-e2e
      - name: Keep the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report/
            web/e2e/test-results/
          if-no-files-found: ignore
